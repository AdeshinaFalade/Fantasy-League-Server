name: Deploy to Heroku

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Heroku deploy action needs full git history
          fetch-depth: 0

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_SERVER_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          # Run Prisma migrations automatically after each deploy
          procfile: "web: npx prisma migrate deploy && npm run start:prod"
